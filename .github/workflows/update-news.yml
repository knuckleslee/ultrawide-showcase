name: Refresh news and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - README.md
      - demo-initial.svg
      - demo-editing.svg
      - news.json
      - scripts/fetch_news.py
      - scripts/smoke_desktop.py
      - .github/workflows/update-news.yml
  schedule:
    - cron: '17 0,12 * * *' # 08:17 and 20:17 Asia/Taipei (UTC+8)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ultrawide-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fetch latest Google News snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/fetch_news.py

      - name: Commit updated snapshot
        run: |
          if ! git diff --quiet -- news.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json
            git commit -m 'chore: refresh Google News snapshot'
            git push origin HEAD:main
          else
            echo 'No changes to news.json'
          fi

      - name: Verify desktop windows in headless Chrome
        run: python3 scripts/smoke_desktop.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html news.json demo-initial.svg demo-editing.svg _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
