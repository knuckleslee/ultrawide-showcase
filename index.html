function newsHTML(){let list=newsData.length?newsData:fakeHeadlines;return list.slice(0,7).map((item,i)=>`<div class="story"><div class="story-photo t${1+i%4}">▤</div><div class="story-copy"><div class="story-title">${escapeHTML(item[0])}</div><div class="story-meta">${escapeHTML(item[1]||'')}</div></div></div>`).join('')}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Use the API on the optional localhost Python server; elsewhere load a static
// snapshot generated twice daily by GitHub Actions. No re-fetch during the presentation.
async function loadNews(){
  const localServer=['localhost','127.0.0.1'].includes(location.hostname)&&location.protocol!=='file:';
  const path=localServer?'/api/news':'./news.json';
  try{
    const url=new URL(path,location.href);
    url.searchParams.set('onload',String(Date.now()));
    const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(8000)});
    if(!r.ok)throw Error('News unavailable ('+r.status+')');
    const data=await r.json();
    if(!Array.isArray(data.items)||!data.items.length)throw Error('No news snapshot yet');
    newsData=data.items.filter(v=>v&&typeof v.title==='string'&&v.title.trim()).map(v=>[
      v.title,String(v.source||'Google News')+' · '+String(v.time||'')
    ]);
    if(!newsData.length)throw Error('Empty headlines');
    newsIsLive=true;
    let label='Google News RSS';
    if(data.updated_at){
      const updated=new Date(data.updated_at);
      if(!Number.isNaN(updated.getTime())){
        label='資料更新 '+updated.toLocaleString('zh-TW',{
          timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false
        });
      }
    }
    if(windowNodes.news){$('#newsStories').innerHTML=newsHTML();$('#newsBadge').textContent=label;}
  }catch(e){
    newsData=[];newsIsLive=false;
    if(windowNodes.news){$('#newsStories').innerHTML=newsHTML();$('#newsBadge').textContent='展示資料（新聞暫不可用）';}
    console.warn('News snapshot unavailable:',e);
  }
}
function scaleDesktop(){let vw=innerWidth,vh=innerHeight;let s=Math.min(vw/BASE_W,vh/BASE_H);$('#desktop').style.transform=`scale(${s})`;}
function applyGeometry(el,g,animate=false){if(animate)el.classList.add('animating');else el.classList.remove('animating');el.style.left=g[0]+'px';el.style.top=g[1]+'px';el.style.width=g[2]+'px';el.style.height=g[3]+'px';}
function layoutEntry(id){return customLayouts[scene].find(g=>g[0]===id)}
function createWindows(){for(const [id,info] of Object.entries(META)){const el=document.createElement('article');el.className='window offscreen';el.dataset.id=id;el.innerHTML=`<div class="titlebar"><div class="app-ico" style="background:${info[2]}">${info[1]}</div><span class="window-title">${info[0]}</span><div class="win-controls"><span class="minimize" title="最小化">−</span><span class="maximize" title="最大化或還原">□</span><span class="close" title="關閉">×</span></div></div><div class="window-content">${apps[id]()}</div><div class="resize-grip"></div>`;$('#windows').append(el);windowNodes[id]=el;attachInteractions(el,id)}
}

function setScene(next,{animation=true,force=false}={}){if(!S[next])return;if(mode==='auto'&&!force)return;scene=next;$$('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===scene));for(const [id,el] of Object.entries(windowNodes)){const geom=layoutEntry(id);if(geom){const [,x,y,w,h]=geom;applyGeometry(el,[x,y,w,h],animation);el.classList.remove('offscreen');el.classList.toggle('free',mode==='manual');}else el.classList.add('offscreen');el.classList.remove('spotlight')};syncTaskbar();if(focused&&windowNodes[focused].classList.contains('offscreen'))focused=null;updateFocus();}
function raise(el){zIndex+=1;el.style.zIndex=zIndex;focused=el.dataset.id;updateFocus()}
function updateFocus(){for(const [id,el] of Object.entries(windowNodes))el.classList.toggle('focused',focused===id)}
function attachInteractions(el,id){const header=el.querySelector('.titlebar');header.addEventListener('pointerdown',e=>{if(e.target.closest('.win-controls')||mode!=='manual')return;pointerStart(e,el,'move')});el.querySelector('.resize-grip').addEventListener('pointerdown',e=>{if(mode!=='manual')return;pointerStart(e,el,'resize')});header.addEventListener('dblclick',e=>{if(mode!=='manual'||e.target.closest('.win-controls'))return;toggleMax(el)});el.addEventListener('pointerdown',()=>{if(mode==='manual')raise(el)});el.querySelector('.maximize').addEventListener('click',()=>{if(mode==='manual')toggleMax(el)});el.querySelector('.minimize').addEventListener('click',()=>{if(mode==='manual')el.classList.add('offscreen')});el.querySelector('.close').addEventListener('click',()=>{if(mode==='manual')el.classList.add('offscreen')});}
function pointerStart(e,el,type){e.preventDefault();e.stopPropagation();raise(el);let id=el.dataset.id,startX=e.clientX,startY=e.clientY;const sc=Math.min(innerWidth/BASE_W,innerHeight/BASE_H),entry=layoutEntry(id);if(!entry)return;let initial=entry.slice(1);el.classList.remove('animating');let target=e.currentTarget;target.setPointerCapture(e.pointerId);const move=p=>{const dx=(p.clientX-startX)/sc,dy=(p.clientY-startY)/sc;let [x,y,w,h]=initial;if(type==='move'){x=clamp(x+dx,0,BASE_W-w);y=clamp(y+dy,51,BOTTOM-h);if(x<15)x=0;if(Math.abs(BASE_W-(x+w))<15)x=BASE_W-w;}else{w=clamp(w+dx,165,BASE_W-x);h=clamp(h+dy,105,BOTTOM-y)};entry.splice(1,4,x,y,w,h);applyGeometry(el,[x,y,w,h])};const end=()=>{target.removeEventListener('pointermove',move);target.removeEventListener('pointerup',end);target.removeEventListener('pointercancel',end)};target.addEventListener('pointermove',move);target.addEventListener('pointerup',end);target.addEventListener('pointercancel',end)}
function toggleMax(el){const id=el.dataset.id,entry=layoutEntry(id);if(!entry)return;if(maxRestore[id]){entry.splice(1,4,...maxRestore[id]);delete maxRestore[id]}else{maxRestore[id]=entry.slice(1);entry.splice(1,4,0,51,BASE_W,BOTTOM-51)}applyGeometry(el,entry.slice(1),true);raise(el)}
function arrange(){if(mode!=='manual')return;const visible=S[scene].map(g=>g[0]).filter(id=>!windowNodes[id].classList.contains('offscreen'));const n=visible.length;if(!n)return;const pad=20,gap=12,top=62,bottom=499;let cols=n<=2?n:n===3?3:n===4?2:3,rows=Math.ceil(n/cols);let w=(BASE_W-pad*2-gap*(cols-1))/cols,h=(bottom-top-gap*(rows-1))/rows;visible.forEach((id,i)=>{const entry=layoutEntry(id);entry.splice(1,4,pad+(i%cols)*(w+gap),top+Math.floor(i/cols)*(h+gap),w,h);applyGeometry(windowNodes[id],entry.slice(1),true)});hint('已將目前視窗自動整理；可以繼續拖曳、縮放。')}
function resetScene(){if(mode==='auto')return;customLayouts[scene]=clone(S[scene]);Object.keys(maxRestore).forEach(k=>delete maxRestore[k]);setScene(scene,{animation:true});hint('已恢復預設視窗配置。')}
function hint(s){if(!showHints)return;$('#hintText').textContent=s;$('#hint').classList.remove('hidden')}
function toast(title,msg){$('#toastTitle').textContent=title;$('#toastBody').textContent=msg;let el=$('#toast');el.classList.remove('hidden','out');setTimeout(()=>el.classList.add('out'),2600);setTimeout(()=>el.classList.add('hidden'),3050)}
function cursorAt(x,y,ms=740){const cur=$('#guideCursor');cur.style.transitionDuration=`${ms}ms`;cur.style.transform=`translate3d(${x-25}px,${y-25}px,0)`;cur.classList.add('show')}
function clickCursor(){const cur=$('#guideCursor');cur.classList.remove('clicking');void cur.offsetWidth;cur.classList.add('clicking');setTimeout(()=>cur.classList.remove('clicking'),450)}
async function delay(ms,id){let remaining=ms;while(remaining>0){if(runId!==id||mode!=='auto')return false;if(paused){await new Promise(r=>setTimeout(r,100));continue;}let slice=Math.min(100,remaining);await new Promise(r=>setTimeout(r,slice));remaining-=slice}return runId===id&&mode==='auto'}
async function action(id,title,body){if(!await delay(450,id))return false;hint(body);$('#statusText').textContent=title;return true}
async function clickAt(x,y,id){cursorAt(x,y,600);if(!await delay(700,id))return false;clickCursor();return await delay(370,id)}
async function focusAction(app,id){const el=windowNodes[app],g=customLayouts[scene].find(v=>v[0]===app);if(!g)return false;if(!await clickAt(g[1]+Math.min(95,g[3]/2),g[2]+14,id))return false;raise(el);el.classList.add('spotlight');await delay(470,id);el.classList.remove('spotlight');return true}
async function demoLayout(sceneId,id){customLayouts[sceneId]=clone(S[sceneId]);setScene(sceneId,{animation:true,force:true});return await delay(1200,id)}
async function showcaseDrag(app,id,deltaX,deltaY){let el=windowNodes[app],g=customLayouts[scene].find(a=>a[0]===app);if(!g)return false;let [_,x,y,w,h]=g;cursorAt(x+95,y+14,550);if(!await delay(650,id))return false;$('#guideCursor').classList.add('dragging');const nx=clamp(x+deltaX,0,BASE_W-w),ny=clamp(y+deltaY,51,BOTTOM-h);cursorAt(nx+95,ny+14,950);g.splice(1,4,nx,ny,w,h);raise(el);applyGeometry(el,[nx,ny,w,h],true);if(!await delay(1150,id))return false;$('#guideCursor').classList.remove('dragging');clickCursor();return true}
async function showcaseResize(app,id,dx,dy){const g=customLayouts[scene].find(a=>a[0]===app);if(!g)return false;let [_,x,y,w,h]=g;cursorAt(x+w-7,y+h-7,600);if(!await delay(710,id))return false;$('#guideCursor').classList.add('dragging');let nw=clamp(w+dx,165,BASE_W-x),nh=clamp(h+dy,105,BOTTOM-y);cursorAt(x+nw-7,y+nh-7,900);g.splice(1,4,x,y,nw,nh);applyGeometry(windowNodes[app],[x,y,nw,nh],true);if(!await delay(1080,id))return false;$('#guideCursor').classList.remove('dragging');clickCursor();return true}
async function runAuto(id){let first=true;while(mode==='auto'&&runId===id){for(const sn of ['daily','editing','coding']){if(runId!==id||mode!=='auto')return;if(!await demoLayout(sn,id))return;if(sn==='daily'){
if(!await action(id,'01 / 日常使用','新聞、聊天、影音與行程集中在同一畫面。'))return;
if(!await focusAction('news',id))return;if(!await delay(900,id))return;
if(!await action(id,'通知提醒','不切換桌面，也能立刻查看新訊息。'))return;toast('Messages · 專案討論群','安妮：等一下方便幫忙確認剪輯預覽嗎？');
if(!await focusAction('chat',id))return;
if(!await action(id,'視窗自由編排','拖曳聊天視窗，讓需要的工作內容同時可見。'))return;
if(!await showcaseDrag('chat',id,-85,-18))return;
if(!await focusAction('video',id))return;if(!await delay(1700,id))return;
}else if(sn==='editing'){
if(!await action(id,'02 / 影片剪輯','素材、播放預覽、調色及時間軸一目了然。'))return;
if(!await focusAction('assets',id))return;if(!await delay(380,id))return;
if(!await focusAction('preview',id))return;
if(!await action(id,'超寬時間軸','放大時間軸視窗，展示水平工作空間的優勢。'))return;
if(!await showcaseResize('timeline',id,0,-35))return;if(!await delay(1500,id))return;
}else{
if(!await action(id,'03 / 程式設計','文件、程式編輯、終端機及即時預覽並排。'))return;
if(!await focusAction('docs',id))return;if(!await focusAction('editor',id))return;
if(!await action(id,'即時測試','修改程式的同時，可以立即看到輸出與預覽。'))return;
if(!await focusAction('terminal',id))return;if(!await focusAction('appview',id))return;if(!await delay(1600,id))return;
}}
if(!await action(id,'展示完成','三種工作情境展示完畢，即將重新播放。'))return;if(!await delay(1350,id))return;first=false;
}}
function setMode(next){if(next===mode){if(next==='auto')togglePause();return}if(next==='auto'){
savedFreeLayouts=clone(customLayouts);mode='auto';paused=false;runId++;$('#desktop').classList.replace('manual','demo');$('#autoMode').classList.add('active');$('#freeMode').classList.remove('active');$('#statusDot').classList.remove('off');$('#arrangeBtn').disabled=true;$('#resetBtn').disabled=true;$('#arrangeBtn').style.opacity='.45';$('#resetBtn').style.opacity='.45';$$('.window').forEach(el=>el.classList.remove('free'));hint('自動展示已開始；大游標將帶領視窗切換與重新排列。');const id=runId;runAuto(id);
}else{mode='manual';runId++;paused=false;$('#guideCursor').classList.remove('show','dragging');$('#desktop').classList.replace('demo','manual');$('#autoMode').classList.remove('active');$('#freeMode').classList.add('active');$('#statusDot').classList.add('off');$('#statusText').textContent='自由操作中';$('#arrangeBtn').disabled=false;$('#resetBtn').disabled=false;$('#arrangeBtn').style.opacity='1';$('#resetBtn').style.opacity='1';// restore the manually arranged workspaces after an automated tour
if(savedFreeLayouts){customLayouts=savedFreeLayouts;savedFreeLayouts=null;}
setScene(scene,{animation:false});hint('自由操作：拖曳標題列移動，右下角縮放，內容會依新尺寸自適應。');}}
function togglePause(){if(mode!=='auto')return;paused=!paused;$('#statusText').textContent=paused?'已暫停展示':'展示播放中';hint(paused?'自動展示已暫停。按 Space 或「自動展示」繼續。':'自動展示繼續播放。')}
async function toggleFullscreen(){const root=$('#frame');try{if(document.fullscreenElement)await document.exitFullscreen();else await root.requestFullscreen()}catch(err){toast('無法進入全螢幕','請嘗試按 F11，或使用 Chrome / Edge。')}scaleDesktop()}
function updateClock(){let t=new Date();$('#clock').textContent=new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}).format(t)}
window.addEventListener('resize',scaleDesktop);document.addEventListener('fullscreenchange',()=>{scaleDesktop();$('#fullscreenBtn').textContent=document.fullscreenElement?'⛶ 離開全螢幕':'⛶ 全螢幕'});
$('#autoMode').addEventListener('click',()=>setMode('auto'));$('#freeMode').addEventListener('click',()=>setMode('manual'));$('#arrangeBtn').addEventListener('click',arrange);$('#resetBtn').addEventListener('click',resetScene);$('#helpBtn').addEventListener('click',()=>$('#help').classList.toggle('hidden'));$('#fullscreenBtn').addEventListener('click',toggleFullscreen);
$$('[data-scene]').forEach(b=>b.addEventListener('click',()=>{if(mode==='auto')setMode('manual');setScene(b.dataset.scene,{animation:true});hint('已切換場景；你可以調整每個視窗的大小與位置。')}));
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();togglePause()}else if(k==='1'||k==='2'||k==='3'){if(mode==='auto')setMode('manual');setScene(['daily','editing','coding'][Number(k)-1],{animation:true})}else if(k==='r'){resetScene()}else if(k==='f'){toggleFullscreen()}else if(k==='h'){showHints=!showHints;$('#hint').classList.toggle('hidden',!showHints)}else if(k==='escape'){$('#help').classList.add('hidden')}});
createWindows();setScene('daily',{animation:false});raise(windowNodes.news);scaleDesktop();updateClock();setInterval(updateClock,30000);loadNews();
</script></body></html>
