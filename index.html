#desktop.manual{cursor:default}#desktop.manual .titlebar,#desktop.manual .resize-grip{touch-action:none}#desktop.demo{cursor:none}#desktop.demo #topbar,#desktop.demo #taskbar{cursor:none}

/* Real desktop app facsimile: windows remain simulated; no accounts or brand affiliation. */
.window { border-radius:7px;border:1px solid #707b865e;box-shadow:0 11px 32px #0009,0 2px 4px #0008; }
.titlebar{background:#292b30;height:30px;color:#e1e4e8}
.window[data-id="news"] .titlebar,.window[data-id="bahamut"] .titlebar {background:#e9edf2;color:#36475a}
.window[data-id="chat"] .titlebar {background:#303b40;color:#f3f7f8}
.window[data-id="discord"] .titlebar{background:#232428;color:#e2e6f0}
.window[data-id="game"] .titlebar{background:#182120;color:#eee}
.window[data-id="assets"] .titlebar,.window[data-id="preview"] .titlebar,.window[data-id="effects"] .titlebar,.window[data-id="timeline"] .titlebar{background:#242528;color:#e0e3e4}
.window[data-id="editor"] .titlebar,.window[data-id="terminal"] .titlebar,.window[data-id="git"] .titlebar{background:#171e2a;color:#c5cddd}
.window-content { overflow:hidden; }

/* Google News in a recognizable browser shell */
.news{height:100%;display:flex;flex-direction:column;background:#fff;color:#202124;font:12px/1.5 Arial,'Microsoft JhengHei',sans-serif;}
.news-browser{flex:none;background:#dee2e8;color:#414a56;font-size:10px}
.browser-tab{height:23px;width:178px;display:flex;align-items:center;gap:6px;background:#fff;border-radius:8px 8px 0 0;padding:0 10px;margin:3px 0 0 9px}
.gnews-mark{font-size:15px;color:#4285f4}.browser-tab-close{margin-left:auto}
.browser-tools{height:29px;display:flex;align-items:center;gap:11px;background:#fff;padding:0 10px;color:#66717d}
.browser-address{flex:1;border-radius:14px;background:#f1f3f4;padding:4px 12px;color:#657080;white-space:nowrap;overflow:hidden}
.news-top{height:47px;flex:none;border-bottom:1px solid #e8eaed;display:flex;align-items:center;gap:20px;padding:0 16px;white-space:nowrap}
.gnews-brand{font-size:19px;font-weight:650;letter-spacing:-1px}.gnews-text{color:#5f6368;letter-spacing:0;margin-left:5px;font-size:16px}
.g-blue{color:#4285f4}.g-red{color:#ea4335}.g-yellow{color:#fbbc05}.g-green{color:#34a853}
.news-search{background:#f1f3f4;color:#747a81;border-radius:20px;padding:6px 16px;flex:1;font-size:11px}
.news-top-right{color:#8b949d}
.news-body{min-height:0;flex:1;display:flex;}
.news-nav{width:124px;flex:0 0 124px;background:#fff;border-right:1px solid #edf0f3;padding:10px 8px;overflow:hidden}
.nav-entry{height:29px;color:#59626c;border-radius:0 17px 17px 0;padding:6px 9px;white-space:nowrap;font-size:11px}
.nav-entry.selected{background:#e8f0fe;color:#1967d2;font-weight:700}
.nav-divider{height:1px;background:#e4e6e9;margin:8px}
.news-main{min-width:0;overflow:hidden;flex:1;padding:12px 16px;background:#fafbfe}
.news-page-heading{display:flex;align-items:center;justify-content:space-between}.news-page-heading strong{display:block;font-size:17px;font-weight:600;color:#202124}.news-page-heading small{display:block;color:#69727e;font-size:10px;margin-top:2px}
.news-location{background:#eaf0f8;padding:5px 10px;border-radius:15px;color:#5c697a;font-size:10px}
.news-category-tabs{display:flex;gap:16px;border-bottom:1px solid #e2e5eb;margin-top:14px;font-size:10px;color:#757e87;white-space:nowrap}.news-category-tabs span{padding:3px 0 7px}.news-category-tabs .active{color:#1a73e8;border-bottom:2px solid #1a73e8}
.news-card-header{display:flex;align-items:center;justify-content:space-between;margin:12px 0 5px}.news-card-header strong{font-size:12px;font-weight:650}
.news-badge{font-size:9px;color:#526b88;background:#e3ecf7;padding:3px 7px;border-radius:9px}
.story{padding:9px 0;border-top:1px solid #e6e9ee}.story-title{color:#202124;font-size:12px}.story-meta{color:#666b75;font-size:10px}
@container (max-width: 450px){.news-nav{display:none}.news-top{gap:9px;padding:0 10px}.news-main{padding:7px 9px}.news-search{display:none}.news-location{display:none}.news-category-tabs{gap:9px}}

/* Desktop messaging: recognizable three-panel structure without showing a product name */
.chat{display:flex;height:100%;background:#fff;color:#252c29;font-size:12px;font-family:'Segoe UI','Microsoft JhengHei',sans-serif}
.chat-rail{width:49px;flex:none;display:flex;flex-direction:column;align-items:center;gap:11px;background:#273136;color:#a9bcc1;padding:11px 4px 12px}
.rail-profile{height:30px;width:30px;border-radius:50%;background:#8296a0;color:#fff;display:grid;place-items:center;font-weight:700}
.rail-tool{height:28px;width:34px;display:grid;place-items:center;border-radius:5px;font-size:19px}.rail-tool.on{color:#fff;background:#445458;border-left:3px solid #08c755}.rail-spacer{flex:1}
.chat .contacts{width:226px;flex:0 0 226px;border-right:1px solid #dfe4e6;padding:0;background:#fff;overflow:hidden}
.chat-list-title{height:45px;display:flex;justify-content:space-between;align-items:center;padding:0 13px;font-size:15px;color:#23292e}
.chat-list-title span{color:#92999e;font-size:17px}.contact-search{height:29px;background:#f1f3f4;margin:0 10px;color:#8c949a;border-radius:5px;padding:6px 10px;font-size:11px}
.chat-list-tabs{display:flex;gap:15px;padding:11px 12px 8px;border-bottom:1px solid #edf0f1;color:#7a8387;font-size:11px}
.chat-list-tabs span.active{color:#05a950;border-bottom:2px solid #06c755;font-weight:700}
.chat .contact{border-radius:0;padding:10px 12px;gap:9px;min-height:62px;align-items:center}
.chat .contact.active{background:#e9f1ec}.chat .avatar{flex:0 0 34px;width:34px;height:34px;font-size:13px;border-radius:50%;background:#91acb4}
.chat .avatar.group{background:#3ab67e}.chat .avatar.group2{background:#b897d1}.chat .avatar.a2{background:#d99b85}.chat .avatar.a3{background:#b0a879}.chat .avatar.a4{background:#81a1c7}
.contact-copy{flex:1;min-width:0}.contact-row{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:11px}
.contact-row strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.contact-row small{font-size:9px;color:#92999c}
.contact-preview{font-size:10px;color:#939d9d;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread{background:#06c755;color:#fff;border-radius:50%;min-width:17px;height:17px;font-size:10px;display:grid;place-items:center}
.chat .chat-view{min-width:0;background:#c8d9d3;display:flex;flex-direction:column}
.chat .chat-head{height:47px;flex:none;background:#fff;border-bottom:1px solid #e4eaeb;padding:6px 15px;display:flex;align-items:center;justify-content:space-between}
.chat-title-group strong{display:block;font-size:13px;color:#333}.chat-title-group small{font-size:10px;color:#8a9598}
.chat-actions{display:flex;align-items:center;gap:16px;font-size:18px;color:#7d8588}
.chat .messages{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#cbd9d2;gap:9px;padding:15px 20px}
.chat-date{text-align:center;color:#758983;font-size:10px;margin:0 0 4px}
.msg{display:flex;gap:9px;align-items:flex-start}.msg .mini-avatar{height:25px;width:25px;background:#cb947e;color:white;display:grid;place-items:center;border-radius:50%;font-size:10px;flex:none}
.msg.mine{justify-content:flex-end;align-items:flex-end}.msg-stack{min-width:0;max-width:80%}.msg-author{font-size:9px;color:#5d6c69;margin:0 0 4px}.msg-row{display:flex;align-items:flex-end;gap:5px}
.chat .bubble{border-radius:12px;background:white;max-width:100%;padding:9px 12px;line-height:1.5;font-size:11px;color:#333;box-shadow:0 1px 2px #0001}
.chat .bubble.me{background:#97e678;align-self:auto;border-radius:12px}
.msg-time{font-size:9px;color:#687f74;white-space:nowrap}.msg-time.read{color:#2a9277}
.chat-entry{height:69px;background:#fff;border-top:1px solid #d3d8d7;padding:7px 10px;flex:none;color:#9ca4a4}
.chat-entry-actions{display:flex;gap:15px;align-items:center;color:#657271;font-size:14px;height:20px}
.chat-entry-text{font-size:11px;color:#a3acad;margin-top:7px}
@container (max-width: 650px){.chat .contacts{flex-basis:180px;width:180px}.chat-rail{width:40px}.chat .messages{padding:10px}.chat-actions{gap:7px}.chat .chat-entry{height:50px}}
@container (max-width: 420px){.chat .contacts{display:none}.chat-rail{width:32px}.chat .messages{padding:7px}.chat .chat-head{height:38px}.chat .msg{gap:5px}}

/* Gaming = true 16:9 canvas in black letterbox + communication apps. */
.game-app{height:100%;background:#03070a;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.game-viewport{display:block;width:100%;height:100%} /* SVG preserveAspectRatio=meet enforces actual 16:9 content */
.game-format-tag{position:absolute;right:9px;top:8px;color:#dce4dd;background:#0b1418bd;font-size:10px;padding:4px 7px;border-radius:3px;pointer-events:none}
.game-app .game-cloud{animation:game-drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.game-app .game-glow{animation:game-glow 4s ease-in-out infinite alternate}
@keyframes game-drift{from{transform:translateX(-25px)}to{transform:translateX(35px)}}
@keyframes game-glow{from{opacity:.58}to{opacity:1}}

/* Discord */
.discord-ui{height:100%;background:#313338;color:#dbdee1;display:flex;font:11px/1.45 'Segoe UI','Microsoft JhengHei',sans-serif;overflow:hidden}
.discord-servers{width:48px;flex:0 0 48px;background:#1e1f22;display:flex;align-items:center;flex-direction:column;gap:10px;padding-top:11px}
.discord-server{width:31px;height:31px;border-radius:50%;background:#313338;display:grid;place-items:center;color:#dce4ee;font-size:14px;position:relative}.discord-server.active{background:#5865f2;border-radius:11px}.discord-server.green{color:#24ba87}
.discord-divider{height:1px;background:#4e5058;width:26px}
.discord-channel-list{background:#2b2d31;display:flex;flex-direction:column;width:132px;flex:0 0 132px;min-width:0}
.discord-server-title{height:42px;padding:12px 10px;border-bottom:1px solid #1f2022;font-weight:700;white-space:nowrap;overflow:hidden}
.discord-section{padding:13px 9px 4px;color:#9b9ca5;text-transform:uppercase;font-size:9px;font-weight:700}
.discord-channel{height:29px;padding:7px 9px;color:#949ba4;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;margin:0 4px}
.discord-channel.selected{color:#f0f3f9;background:#41434b}.discord-voice{margin-top:auto;border-top:1px solid #242629;font-size:9px;padding:8px;color:#8ec7ae}
.discord-main{flex:1;display:flex;flex-direction:column;min-width:0;background:#313338}
.discord-header{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #25262b;padding:0 12px;font-size:12px;font-weight:700}
.discord-header span{color:#b5bac1}
.discord-messages{flex:1;min-height:0;overflow:hidden;padding:11px 13px;display:flex;flex-direction:column;gap:11px}
.discord-post{display:flex;gap:8px;align-items:flex-start;min-width:0}.discord-userpic{height:26px;width:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:#6385aa;color:white;font-weight:700}.discord-userpic.pink{background:#b87fbd}.discord-userpic.green{background:#4ca38c}
.discord-post-body{min-width:0}.discord-author{font-size:11px;color:#f1f3f7;font-weight:700}.discord-author small{font-weight:400;font-size:9px;color:#8e939c;margin-left:5px}.discord-post-content{color:#c5c9d0;font-size:10px;line-height:1.5;margin-top:3px}
.discord-embed{margin-top:7px;border-left:3px solid #5965f2;border-radius:2px;background:#26282d;padding:7px;font-size:10px;color:#cbd4e9}
.discord-input{height:35px;flex:none;background:#383a40;border-radius:5px;margin:0 10px 10px;padding:9px;color:#999ca5;font-size:10px}
@container (max-width: 330px){.discord-channel-list{display:none}.discord-servers{width:38px;flex-basis:38px}}

/* Bahamut forum */
.bahamut-ui{height:100%;background:#eef1f4;color:#273440;display:flex;flex-direction:column;overflow:hidden;font:11px/1.5 'Microsoft JhengHei','Segoe UI',sans-serif}
.baha-top{height:38px;display:flex;align-items:center;gap:13px;flex:none;background:#00768e;color:#fff;padding:0 14px}
.baha-logo{font-weight:900;font-size:17px;white-space:nowrap;letter-spacing:1px}.baha-search{background:#ffffffdd;color:#768a94;border-radius:3px;padding:4px 12px;flex:1;max-width:230px;font-size:10px}.baha-top-icons{margin-left:auto;white-space:nowrap;letter-spacing:3px}
.baha-nav{height:31px;background:#0b4e62;color:#c8e8f0;display:flex;align-items:center;gap:20px;padding:0 15px;white-space:nowrap;font-size:11px;flex:none}
.baha-nav .active{color:#fff;border-bottom:2px solid #82daec;height:100%;display:flex;align-items:center}
.baha-body{padding:12px 14px;overflow:hidden;min-height:0;display:flex;flex-direction:column;flex:1}
.baha-breadcrumb{font-size:10px;color:#5f90a5;margin-bottom:8px}.baha-forumhead{display:flex;gap:12px;align-items:center;padding:11px;background:#fff;border:1px solid #d5dce1}
.baha-cover{height:48px;width:48px;border-radius:4px;background:linear-gradient(145deg,#33494e,#74a98a);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;flex:none}
.baha-forumhead strong{font-size:15px;color:#194054}.baha-forumhead small{display:block;font-size:10px;color:#8d9ca4;margin-top:2px}
.baha-tabs{display:flex;gap:14px;padding:9px 11px 0;background:#fff;border-bottom:2px solid #0d8f9c;color:#6a8591;flex:none}
.baha-tabs span{padding:4px 5px 6px;white-space:nowrap}.baha-tabs .active{background:#0e8d9d;color:#fff}
.baha-table{background:#fff;min-height:0;flex:1;overflow:hidden}.baha-table-head{display:grid;grid-template-columns:minmax(0,1fr) 45px 45px;gap:5px;padding:9px 12px;color:#678392;border-bottom:1px solid #e3e8ec;font-size:10px}
.baha-thread{display:grid;grid-template-columns:minmax(0,1fr) 45px 45px;gap:5px;align-items:center;padding:10px 12px;border-bottom:1px solid #e6ecef;font-size:11px}
.baha-thread-title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600;color:#146783}.baha-thread-title b{font-size:10px;background:#f2b446;color:white;margin-right:6px;padding:2px 4px;border-radius:2px}
.baha-thread small{font-size:9px;color:#9aa6ad}.baha-bottom{background:#fff;border-top:1px solid #dae1e6;padding:6px 10px;font-size:9px;color:#7894a6;flex:none}
@container (max-width: 400px){.baha-search{display:none}.baha-top-icons{display:none}.baha-nav{gap:8px}.baha-table-head,.baha-thread{grid-template-columns:minmax(0,1fr) 33px 33px}.baha-forumhead{padding:5px}.baha-thread{padding:7px}}


/* Videoplayer: recognizable browser + video-platform chrome */
.window[data-id="video"] .titlebar{background:#f1f3f4;color:#465057}
.video-wrap{display:flex;flex-direction:column;height:100%;padding:0;gap:0;background:#fff;color:#15191e;font:11px Arial,sans-serif}
.yt-browser{display:flex;align-items:center;gap:7px;background:#f6f7f8;color:#69747c;flex:none;height:24px;padding:0 9px;font-size:10px}
.yt-address{flex:1;background:#e6e9ed;border-radius:12px;padding:2px 10px;overflow:hidden;white-space:nowrap}
.yt-header{flex:none;height:29px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #e7e9eb;padding:0 10px}
.yt-brand{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:850;white-space:nowrap}
.yt-brand .yt-logo{display:inline-grid;place-items:center;width:24px;height:16px;color:white;background:#ff0033;border-radius:5px;font-size:9px}
.yt-search{flex:1;max-width:250px;border-radius:16px;border:1px solid #d9dbdf;color:#90989f;font-size:10px;padding:3px 10px;overflow:hidden;white-space:nowrap}
.yt-main{flex:1;min-height:0;display:flex;gap:9px;padding:9px;overflow:hidden}
.yt-view{flex:1;min-width:0;display:flex;flex-direction:column}
.yt-video{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 25%,#eead8f,transparent 28%),linear-gradient(160deg,#63819f,#233d5c 52%,#162d47);border-radius:3px}
.yt-video:before{content:"";position:absolute;inset:auto 0 0;height:58%;background:#264b52;clip-path:polygon(0 85%,22% 39%,39% 61%,61% 13%,78% 65%,100% 19%,100% 100%,0 100%)}
.yt-video:after{content:"";position:absolute;left:8px;right:8px;bottom:7px;height:3px;border-radius:3px;background:linear-gradient(90deg,#ff0033 0 38%,#a9afaf 38%)}
.yt-center-play{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);border-radius:10px;background:#18191ad9;color:#fff;font-size:20px;padding:10px 14px}
.yt-player-controls{position:absolute;bottom:16px;left:10px;color:white;font-size:10px}
.yt-title{font-size:11px;font-weight:800;padding:6px 0 0;color:#222;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.yt-detail{display:flex;justify-content:space-between;color:#626c76;font-size:9px}
.yt-next{flex:0 0 125px;width:125px;font-size:10px;overflow:hidden}
.yt-next strong{font-size:10px}.yt-suggestion{display:flex;gap:5px;margin-top:8px}.yt-suggestion-image{width:52px;height:34px;flex:none;border-radius:3px;background:linear-gradient(130deg,#a5a6ba,#44537e)}.yt-suggestion:nth-child(3) .yt-suggestion-image{background:linear-gradient(130deg,#79a7a6,#3d596e)}
@container (max-width: 490px){.yt-next{display:none}.yt-main{padding:5px}.yt-header{gap:5px}.yt-search{display:none}}

/* DaVinci Resolve-inspired dark editing panels */
.window[data-id="assets"] .window-content,.window[data-id="preview"] .window-content,.window[data-id="effects"] .window-content,.window[data-id="timeline"] .window-content{background:#1a1a1d}
.assets{background:#202124;padding:0;color:#cfd0d1;display:flex;flex-direction:column}
.resolve-toolbar{height:27px;background:#2b2d30;border-bottom:1px solid #414349;color:#dbdde0;display:flex;align-items:center;gap:11px;padding:0 11px;font-size:10px;flex:none}
.resolve-toolbar span.dim{color:#9ba2a9}.resolve-toolbar span.active{border-bottom:2px solid #cfb367;height:100%;display:flex;align-items:center;color:#f7f7f7}
.resolve-path{background:#1e2022;color:#88939e;padding:5px 10px;font-size:10px;flex:none}
.assets .asset-grid{padding:9px;overflow:hidden;grid-template-columns:repeat(2,minmax(0,1fr))}
.assets .asset-thumb{height:68px;border-radius:1px;border:1px solid #0009}.assets .asset-label{color:#a8b5bd}
.preview{padding:0;background:#171719}
.resolve-view-top{height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#292b2d;color:#b5b6ba;font-size:10px;flex:none}
.preview-visual{margin:10px auto 3px;width:min(88%,100%);height:calc(100% - 80px);flex:1;min-height:50px;border:1px solid #404145;border-radius:1px;background:radial-gradient(circle at 60% 25%,#ffd1a9 0 9%,transparent 19%),linear-gradient(155deg,#858ca0,#2d4c73 55%,#192c43)}
.preview-transport{height:22px;background:#242529;color:#a7b1bd;font-size:12px;display:flex;align-items:center;justify-content:center;gap:16px;flex:none}
.preview-bottom{padding:6px 12px;font-size:10px;flex:none;background:#242528}
.effects{background:#222426;padding:0;color:#cfd4d9}
.effects .resolve-toolbar{justify-content:flex-start}
.effects-inner{padding:7px 11px;overflow:hidden}
.fx-item{border-color:#4a4d50;font-size:10px;padding:7px 0}
.fx-track{background:#494c52}.fx-track:after{background:#ddd}
.timeline{padding:0;background:#1f2023;color:#cbd0d3;position:relative}
.timeline .resolve-toolbar{height:24px}
.timeline-scale{padding:6px 6px 5px 84px;background:#27282c;border-bottom:1px solid #4c4d52;color:#a6b1ba;font-size:9px}
.track{height:28px;margin:0;border-bottom:1px solid #515357;gap:2px}
.trackname{flex:0 0 78px;width:78px;background:#303138;height:100%;padding:8px 5px;font-size:9px;color:#a8bcc8}
.clip{border-radius:0;height:20px;font-size:9px}.clip.v2{background:#566b8a}.clip.au{background:repeating-linear-gradient(90deg,#685c88 0,#685c88 9px,#796a9d 9px,#796a9d 11px)}
.timeline .playhead{top:53px;height:calc(100% - 53px);left:45%;border-color:#ed6866}.timeline .playhead:before{color:#ed6866}
@container (max-height: 150px){.resolve-toolbar{height:18px}.resolve-path{display:none}.assets .asset-thumb{height:25px}.preview-visual{height:40px}.effects-inner{padding:0 5px}.fx-item{padding:1px 0}.timeline-scale{padding:2px}.track{height:17px}.trackname{padding:2px}.clip{height:14px}}

/* VS Code-like workspace: activity bar, explorer, tabs and status bar */
.editor{position:relative;display:flex;padding-bottom:20px;background:#1e1e1e;color:#d4d4d4}
.vscode-bar{background:#181c24;display:flex;flex-direction:column;gap:16px;align-items:center;width:36px;flex:0 0 36px;padding:12px 0 0;color:#8993a2;font:19px 'Segoe UI';border-right:1px solid #303843}
.vscode-bar span.selected{color:#e3e5f1;border-left:2px solid #7cafe7;width:100%;text-align:center}

/* 04: actual YouTube gaming video. Central window itself is 777x437 (16:9). */
/* Keep the entire 16:9 central rectangle for the film, not just the area
   below the virtual window titlebar. The titlebar overlays on hover for drag. */
.window[data-id="game"] .titlebar{position:absolute;left:0;right:0;top:0;z-index:12;height:24px;background:#122237c9;opacity:0;transition:opacity .2s}

#gamingPlayer{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.game-video-poster{display:block;position:absolute;inset:0;z-index:3;width:100%;height:100%;padding:0;border:0;background:#000;cursor:pointer;overflow:hidden}
.game-video-poster[hidden]{display:none}
.game-poster-image{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.game-video-poster:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0002,transparent 42%);pointer-events:none}
.game-poster-play{display:grid;place-items:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:65px;height:46px;border-radius:14px;background:#ed2028eb;color:#fff;font-size:22px;box-shadow:0 2px 15px #0007;transition:background .2s,transform .2s}
.game-video-poster:hover .game-poster-play,.game-video-poster:focus-visible .game-poster-play{background:#f00;transform:translate(-50%,-50%) scale(1.08)}
.game-video-poster:focus-visible{outline:2px solid #9ad6ff;outline-offset:-3px}
.game-video-attribution{position:absolute;bottom:5px;right:8px;color:#f5f7fa;background:#020d15a6;font-size:9px;padding:3px 6px;z-index:2;text-decoration:none;opacity:.15;transition:opacity .25s}
.game-app:hover .game-video-attribution{opacity:1}

 return list.slice(0,12).map((item,i)=>'<button type="button" class="story" data-news-index="'+i+'"><div class="story-photo t'+(1+i%4)+'">▤</div><div class="story-copy"><div class="story-title">'+escapeHTML(item[0])+'</div><div class="story-meta">'+escapeHTML(item[1]||'')+'</div></div></button>').join('');

function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Use the API on the optional localhost Python server; elsewhere load a static
// snapshot generated twice daily by GitHub Actions. No re-fetch during the presentation.
async function loadNews(){
  const localServer=['localhost','127.0.0.1'].includes(location.hostname)&&location.protocol!=='file:';
  const path=localServer?'/api/news':'./news.json';
  try{
    const url=new URL(path,location.href);
    url.searchParams.set('onload',String(Date.now()));
    const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(8000)});
    if(!r.ok)throw Error('News unavailable ('+r.status+')');
    const data=await r.json();
    if(!Array.isArray(data.items)||!data.items.length)throw Error('No news snapshot yet');
    newsData=data.items.filter(v=>v&&typeof v.title==='string'&&v.title.trim()).map(v=>[
      v.title,String(v.source||'Google News')+' · '+String(v.time||''),typeof v.link==='string'?v.link:''
    ]);
    if(!newsData.length)throw Error('Empty headlines');
    newsIsLive=true;
    let label='Google News RSS';
    if(data.updated_at){
      const updated=new Date(data.updated_at);
      if(!Number.isNaN(updated.getTime())){
        label='資料更新 '+updated.toLocaleString('zh-TW',{
          timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false
        });
      }
    }
    if(windowNodes.news){$('#newsStories').innerHTML=newsHTML();$('#newsBadge').textContent=label;}
  }catch(e){
    newsData=[];newsIsLive=false;
    if(windowNodes.news){$('#newsStories').innerHTML=newsHTML();$('#newsBadge').textContent='展示資料（新聞暫不可用）';}
    console.warn('News snapshot unavailable:',e);
  }
}

function renderCalendar(offset){
 const el=document.querySelector('.calendar');
 if(!el)return;
 const shift=Math.max(-24,Math.min(24,Number(offset)||0));
 const currentDate=new Date();
 const first=new Date(currentDate.getFullYear(),currentDate.getMonth()+shift,1);
 const year=first.getFullYear(),month=first.getMonth(),start=first.getDay();
 const days=new Date(year,month+1,0).getDate();
 const total=Math.ceil((start+days)/7)*7;
 const cells=['日','一','二','三','四','五','六'].map(day=>'<span class="heading">'+day+'</span>');
 for(let i=0;i<total;i++){
   const date=i-start+1;
   const inMonth=date>=1&&date<=days;
   const today=year===currentDate.getFullYear()&&month===currentDate.getMonth()&&date===currentDate.getDate();
   cells.push('<span'+(today?' class="today"':'')+'>'+(inMonth?date:'')+'</span>');
 }
 el.dataset.shift=String(shift);
 el.querySelector('.cal-month-label').textContent=year+' 年 '+(month+1)+' 月';
 el.querySelector('.cal-days').innerHTML=cells.join('');
 const foot=el.querySelector('.cal-foot');
 foot.textContent=shift===0?'● 14:30　專案進度同步':(month+1)+' 月 · 行程規劃與活動';
}

/* Repository controls adjust only central VS Code text; GitHub font stays fixed. */
const VSCODE_FONT_PRESETS=Object.freeze({XS:9,SM:10,MD:12,LG:15,XL:18});
const VSCODE_FONT_MIN=6,VSCODE_FONT_MAX=30;
function syncGitFontControls(mode,size){
 const panel=windowNodes.git?.querySelector('.live-github');
 if(!panel)return;
 panel.querySelectorAll('.git-size-button[data-font-mode]').forEach(button=>{
  const active=button.dataset.fontMode===mode;
  button.classList.toggle('active',active);
  button.setAttribute('aria-pressed',String(active));
 });
 panel.querySelectorAll('.git-size-button[data-font-step]').forEach(button=>{
  button.disabled=button.dataset.fontStep==='-1'?size<=VSCODE_FONT_MIN:size>=VSCODE_FONT_MAX;
 });
}
function setGitFontMode(mode){
 if(!Object.hasOwn(VSCODE_FONT_PRESETS,mode))return;
 const editor=windowNodes.editor?.querySelector('.coding-editor');
 if(!editor)return;
 editor.style.removeProperty('--vscode-code-size');
 editor.dataset.editorFont=mode;
 syncGitFontControls(mode,VSCODE_FONT_PRESETS[mode]);
}
function setGitFontSize(size){
 const editor=windowNodes.editor?.querySelector('.coding-editor');
 if(!editor||!Number.isFinite(size))return;
 const next=Math.max(VSCODE_FONT_MIN,Math.min(VSCODE_FONT_MAX,Math.round(size)));
 const preset=Object.keys(VSCODE_FONT_PRESETS).find(mode=>VSCODE_FONT_PRESETS[mode]===next);
 if(preset){setGitFontMode(preset);return}
 editor.style.setProperty('--vscode-code-size',next+'px');
 editor.dataset.editorFont='CUSTOM';
 syncGitFontControls(null,next);
}
function adjustGitFontSize(step){
 const editor=windowNodes.editor?.querySelector('.coding-editor');
 if(!editor)return;
 const current=parseFloat(getComputedStyle(editor).getPropertyValue('--vscode-code-size'))||VSCODE_FONT_PRESETS.MD;
 setGitFontSize(current+step);
}

/* Display real, contiguous source lines around the actual GitHub font handler.
   The demo adds/refactors lines IN THIS code section; do not append JS after
   a Python file, and never insert presentation labels among source code. */
function renderSourceLines(){
 const container=document.getElementById('realCodeLines');
 if(!container)return;
 const fragment=document.createDocumentFragment();
 codingViewLines.forEach((item,index)=>{
  const row=document.createElement('div');
  row.className='source-code-line'+(item.added?' demo-added':'');
  row.dataset.sourceIndex=String(index);
  const number=document.createElement('span');
  number.className='line-num';
  number.textContent=String(codingSourceStartLine+index);
  const content=document.createElement('span');
  content.className='line-text';
  content.textContent=item.text;
  row.append(number,content);fragment.append(row);
 });

function renderRealSource(source,{embedded=false}={}){
 const lines=source.split(/\r?\n/);
 const idx=lines.findIndex(line=>line.trim()==='function setGitFontMode(mode){');
 if(idx<0)return false;
 const first=Math.max(0,idx-1),last=Math.min(lines.length,idx+38);
 codingRawSource=source;
 codingSourceStartLine=first+1;
 codingViewLines=lines.slice(first,last).map(text=>({text,added:false}));
 codingDemoCompleted=0;
 renderSourceLines();
 const loader=document.getElementById('editorLoadState');
 if(loader)loader.textContent=embedded
  ? 'INDEX.HTML  /  JAVASCRIPT  /  本頁內嵌來源'
  : 'INDEX.HTML  /  JAVASCRIPT  /  目前部署版本';
 return true;
}
function scrollEditorRowIntoView(row,behavior='smooth'){

 const scale=pane.height/Math.max(1,viewport.clientHeight);
 const target=viewport.scrollTop+
  (rect.top+rect.height*.5-pane.top-pane.height*.43)/Math.max(.01,scale);
 viewport.scrollTo({top:Math.max(0,target),behavior});
}

 const repoDescription=document.getElementById('gitRepoDescription');
 const files=document.getElementById('gitLiveFiles');

  if(!response.ok)throw Error('GitHub HTTP '+response.status);
  return response.json();
 };
 // Each load is independent: failing metadata will not prevent source loading.

 }catch(err){
  if(badge)badge.textContent='OFFLINE';
  if(repoDescription)repoDescription.textContent='GitHub 資料暫時無法載入，請用下方原站連結查看。';
 }
 try{
  const listing=await loadJSON(base+'/contents');
  if(Array.isArray(listing)&&files){
   files.replaceChildren();
   for(const item of listing.filter(x=>x&&x.name).slice(0,14)){
    const row=document.createElement('div');
    row.className='git-file';
    row.textContent=(item.type==='dir'?'▸　':'▤　')+item.name;
    files.append(row);
   }
  }
 }catch(err){if(files)files.textContent='GitHub files 暫時無法載入。'}

 // Load REAL README text as a text-rich font-size sample, never invented copy.
 const readme=document.getElementById('gitReadmeContent');
 try{
  const url='https://raw.githubusercontent.com/'+CODE_REPO+'/main/README.md';
  const response=await fetch(url,{signal:AbortSignal.timeout(10000),cache:'no-store'});
  if(!response.ok)throw Error('README HTTP '+response.status);
  const markdown=await response.text();
  const fence=String.fromCharCode(96).repeat(3);
  const lines=markdown.split(/\r?\n/).map(line=>line.trim()).filter(line=>
    line && !line.startsWith('![') && !line.startsWith(fence) &&
    !line.startsWith('|') && !/^[-=]{3,}$/.test(line) &&
    !/^\d+\.\s*https?:\/\//.test(line)
  ).slice(0,23);
  if(!lines.length)throw Error('README is empty');
  if(readme){
   readme.replaceChildren();
   for(const line of lines){
    const item=document.createElement('p');
    item.className='git-readme-line';
    if(/^#{1,5}\s/.test(line))item.classList.add('is-heading');
    if(/^[-*]\s/.test(line))item.classList.add('is-list');
    item.textContent=line.replace(/^#{1,5}\s+/,'').replace(/^[-*]\s/,'• ')
      .replace(/!\[[^\]]*\]\([^)]+\)/g,'')
      .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
      .replace(/\*\*/g,'');
    readme.append(item);
   }
   readme.dataset.source='github-raw';
  }
 }catch(err){
  if(readme){
   readme.textContent='README.md cannot be loaded right now. Use the GitHub source link below.';
   readme.dataset.source='unavailable';
  }
 }
 // Source code is loaded from the ACTUAL deployed index.html.
 // Editor and preview consequently use the same revision, including on Pages.
 try{
  const sourceURL=new URL('index.html',location.href);
  const response=await fetch(sourceURL.href,{cache:'no-store',signal:AbortSignal.timeout(8000)});
  if(!response.ok)throw Error('Main page HTTP '+response.status);
  const raw=await response.text();
  if(mode==='auto'&&scene==='coding'&&codingDemoCompleted>0){
   // Don't erase the in-progress editor presentation if the fetch finishes late.
  }else if(!renderRealSource(raw)){
   throw Error('GitHub font handler not found in live index.html');
  }
 }catch(err){
  if(!hasRealEditorSource()&&loader)
   loader.textContent='INDEX.HTML  /  JAVASCRIPT  /  目前無法取得原始碼';
 }
}

/* A guided, in-memory refactor of the real index.html source excerpt.
   Only code belongs in the editor: no step banners, pseudo line numbers, or
   JavaScript appended to Python. Each edit is numbered like a real editor. */
async function typeInEditorRow(row,index,code,id){
 const output=row?.querySelector('.line-text');
 if(!output)return false;
 scrollEditorRowIntoView(row);
 const p=demoElementCoords(row);
 cursorAt(Math.min(p.x+70,BASE_W-28),p.y,430);
 if(!await delay(500,id))return false;
 // Type only into the selected source line; leave presentation labels in Agent.
 for(let n=0;n<code.length;n+=5){
  if(!await delay(30,id))return false;
  output.textContent=code.slice(0,n+5)+'▌';
 }
 output.textContent=code;
 codingViewLines[index].text=code;
 return await delay(240,id);
}
async function applyDemoCodeStep(step,id){
 if(!hasRealEditorSource())return false;
 const scroller=document.getElementById('codingScroll');
 if(step.lines){
  for(const code of step.lines){
   const insertion=locateFontHandler();
   if(insertion<0)return false;
   codingViewLines.splice(insertion,0,{text:'',added:true});
   renderSourceLines();
   const row=document.getElementById('realCodeLines')?.children[insertion];
   if(!await typeInEditorRow(row,insertion,code,id))return false;
  }
 }else if(step.replaceLine){
  // Refactor the existing handler rather than appending a disconnected snippet.
  const index=codingViewLines.findIndex(item=>!item.added&&
    item.text.trim()==='editor.dataset.editorFont=mode;');
  if(index<0)return false;
  codingViewLines[index].text='';
  codingViewLines[index].added=true;
  renderSourceLines();
  const row=document.getElementById('realCodeLines')?.children[index];
  if(!await typeInEditorRow(row,index,step.replaceLine,id))return false;
 }else return false;
 codingDemoCompleted++;
 const progress=document.getElementById('editorChangeCount');
 if(progress)progress.textContent='已完成 '+codingDemoCompleted+' / '+AGENT_EDITS.length+' 步（示範）';
 const terminal=document.getElementById('codingTerminalStatus');
 if(terminal)terminal.textContent='目前已示範 '+codingDemoCompleted+' 步；尚未寫回 GitHub';
 return true;
}

/* Fit 16:9 video and let information panels consume the remaining space.
   ResizeObserver follows freely resized windows as well as scene transitions. */
/* Natural monitor width is derived from the existing image-region height.
   The two identical 16:9 monitors touch at the right; Effects fills the left. */
/* Resize only the 16:9 picture areas; the upper-left Source and
   full-height right Program intentionally have different sizes. */
function arrangePremiereMonitors(){
 const desk=document.querySelector('.pp-panels');
 if(!desk||desk.clientWidth<2||desk.clientHeight<2)return;
 for(const kind of ['source','program']){
  const panel=desk.querySelector('.pp-'+kind);
  if(!panel)continue;
  const view=panel.querySelector('.pp-monitor-view');
  const image=view?.querySelector('.pp-monitor-shot');
  if(!view||!image||view.clientWidth<2||view.clientHeight<2)continue;
  const s=getComputedStyle(view);
  const padX=(parseFloat(s.paddingLeft)||0)+(parseFloat(s.paddingRight)||0);
  const padY=(parseFloat(s.paddingTop)||0)+(parseFloat(s.paddingBottom)||0);
  const gap=(parseFloat(s.gap)||0);
  const usableH=Math.max(1,view.clientHeight-padY);
  const usableW=Math.max(1,view.clientWidth-padX);
  const scopes=kind==='program'?view.querySelector('.pp-program-scopes'):null;
  const scopesActive=!!(scopes&&getComputedStyle(scopes).display!=='none');
  // Reserve ~15% of the Program area for useful Lumetri scopes.
  const targetScope=scopesActive?Math.max(65,Math.min(140,usableW*.17)):0;
  const availablePictureW=scopesActive?usableW-targetScope-gap:usableW;
  const mediaW=Math.max(1,Math.min(availablePictureW,usableH*16/9));
  image.style.width=mediaW+'px';
  image.style.height=mediaW*9/16+'px';
 }
}
const premiereResizeObserver=new ResizeObserver(()=>arrangePremiereMonitors());
function watchPremiereMonitors(){
 const desk=document.querySelector('.pp-panels');
 if(desk)premiereResizeObserver.observe(desk);
 arrangePremiereMonitors();
}

/* Premiere's embedded preview is simulated, but play / pause and timeline
   really update together. Playback animates each guitarist's pose subtly. */
let premierePlaybackTimer=null,premiereElapsedSeconds=0,premiereStartedAt=0;
let premiereResumeAfterTourPause=false;
function updatePremierePlayback(){
 const host=windowNodes.premiere;
 if(!host)return;
 const elapsed=Math.max(0,premiereElapsedSeconds+(premierePlaybackTimer?(performance.now()-premiereStartedAt)/1000:0));
 const progress=(elapsed%16)/16;
 const seconds=Math.floor(17+elapsed),frames=Math.floor(((17+elapsed)%1)*24);
 const mm=String(Math.floor(seconds/60)).padStart(2,'0');
 const ss=String(seconds%60).padStart(2,'0');
 const time='00:'+mm+':'+ss+':'+String(frames).padStart(2,'0');
 const code=host.querySelector('.pp-program .pp-timecode');
 const timelineCode=host.querySelector('.pp-timeline-head b');
 if(code)code.textContent=time;
 if(timelineCode)timelineCode.textContent=time;
 const scrub=host.querySelector('.pp-program .pp-scrub-rail i');
 if(scrub)scrub.style.left=(63+progress*28)+'%';
 const timeline=host.querySelector('.pp-playhead');
 if(timeline)timeline.style.left=(38+progress*29)+'%';
 const effectPlayhead=host.querySelector('.pp-fx-playhead');
 if(effectPlayhead)effectPlayhead.style.left=(39+progress*23)+'%';
 const meters=host.querySelectorAll('.pp-meter-level');
 if(meters.length===2){
  const a=elapsed*6.3;
  meters[0].style.height=(53+Math.round(18*Math.abs(Math.sin(a))))+'%';
  meters[1].style.height=(47+Math.round(24*Math.abs(Math.sin(a+1.3))))+'%';
 }
}
function setPremierePlaying(playing){
 const host=windowNodes.premiere;
 if(!host)return;
 const program=host.querySelector('.pp-program');
 const button=host.querySelector('.pp-demo-play');
 if(playing){
  if(!premierePlaybackTimer){
   premiereStartedAt=performance.now();
   premierePlaybackTimer=setInterval(updatePremierePlayback,110);
  }
 }else if(premierePlaybackTimer){
  premiereElapsedSeconds+=(performance.now()-premiereStartedAt)/1000;
  clearInterval(premierePlaybackTimer);
  premierePlaybackTimer=null;
 }
 program?.classList.toggle('pp-is-playing',!!playing);
 if(button){
  button.textContent=playing?'Ⅱ':'▶';
  button.setAttribute('aria-pressed',String(!!playing));
  button.setAttribute('aria-label',playing?'暫停模擬 Premiere 預覽':'播放模擬 Premiere 預覽');
 }
 const indicator=host.querySelector('.pp-demo-indicator');
 if(indicator)indicator.textContent=playing?'PLAYING':'PAUSED';
 updatePremierePlayback();
}
function resetPremierePlayback(){

/* 可互動的 Lumetri RGB 色階曲線。四個通道分別儲存控制點，
   操作僅作用於 Program 預覽，Source 原始畫面不變。 */
const premiereToneLevels={RGB:0,R:0,G:0,B:0};
let premiereToneChannel='RGB';
const toneClamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function premiereCurvePath(value){
 const v=toneClamp(value,-1,1);
 const y=n=>Math.round(n*10)/10;
 return 'M 19 208 C 58 '+y(171+v*15)+' 93 '+y(129-v*34)+
        ' 117 '+y(110-v*60)+' S 185 '+y(38-v*13)+' 215 12';
}
function updatePremiereToneCurve(value,channel=premiereToneChannel){
 const host=windowNodes.premiere;
 if(!host||!Object.prototype.hasOwnProperty.call(premiereToneLevels,channel))return;
 const level=toneClamp(Number(value)||0,-1,1);
 premiereToneLevels[channel]=level;
 const program=host.querySelector('.pp-program');
 for(const [key,grade] of Object.entries(premiereToneLevels)){
  const path=program?.querySelector('[data-curve-path="'+key+'"]');
  if(path)path.setAttribute('d',premiereCurvePath(grade));
 }
 const selected=premiereToneLevels[premiereToneChannel];
 const point=program?.querySelector('[data-curve-point]');
 if(point){
  point.setAttribute('cy',String(Math.round((110-selected*60)*10)/10));
  point.setAttribute('aria-valuenow',String(Math.round(selected*100)));
  point.setAttribute('aria-valuetext',(selected>=0?'提升 ':'降低 ')+Math.abs(Math.round(selected*100))+'%');
  const colors={RGB:'#f2f6fc',R:'#ee7d89',G:'#81db9e',B:'#8fb6fa'};
  point.setAttribute('fill',colors[premiereToneChannel]);
 }
 const label=host.querySelector('[data-curve-value]');
 if(label)label.textContent=(selected>0?'+':'')+Math.round(selected*100);
 const master=premiereToneLevels.RGB;
 const contrast=1+master*.48;
 const brightness=1+master*.24;
 const saturate=Math.max(.45,1+master*.48+premiereToneLevels.G*.18);
 const hue=premiereToneLevels.R*12-premiereToneLevels.B*17;
 const image=host.querySelector('.pp-program .pp-monitor-shot');
 if(image){
  image.style.filter='brightness('+brightness.toFixed(3)+') contrast('+contrast.toFixed(3)+
    ') saturate('+saturate.toFixed(3)+') hue-rotate('+hue.toFixed(1)+'deg)';
  image.dataset.toneGrade=String(Math.round(master*100));
 }
 const contrastLabel=host.querySelector('[data-curve-contrast]');
 if(contrastLabel)contrastLabel.textContent=Math.round(contrast*100)+'%';
}
function selectPremiereToneChannel(channel){
 const host=windowNodes.premiere;
 if(!host||!Object.prototype.hasOwnProperty.call(premiereToneLevels,channel))return;
 premiereToneChannel=channel;
 host.querySelectorAll('.pp-curve-channel').forEach(button=>{
  const active=button.dataset.curveChannel===channel;
  button.classList.toggle('selected',active);
  button.setAttribute('aria-pressed',String(active));
 });
 for(const key of ['RGB','R','G','B']){
  const path=host.querySelector('[data-curve-path="'+key+'"]');
  if(path){
   path.style.opacity=key===channel?'1':(channel==='RGB'?'.55':'.24');
   path.style.strokeWidth=key===channel?'3':'1.2';
  }
 }
 updatePremiereToneCurve(premiereToneLevels[channel],channel);
}
function resetPremiereToneCurve(){
 for(const key of Object.keys(premiereToneLevels))premiereToneLevels[key]=0;
 selectPremiereToneChannel('RGB');
 updatePremiereToneCurve(0,'RGB');
}
function setupPremiereCurveInteractions(){
 const host=windowNodes.premiere;
 const point=host?.querySelector('[data-curve-point]');
 const svg=host?.querySelector('.pp-curve-svg');
 if(!point||!svg)return;
 host.querySelectorAll('.pp-curve-channel').forEach(button=>{
  button.addEventListener('click',()=>selectPremiereToneChannel(button.dataset.curveChannel));
 });
 let dragging=false;
 function pointerLevel(event){
  const matrix=svg.getScreenCTM();
  if(!matrix)return premiereToneLevels[premiereToneChannel];
  const p=svg.createSVGPoint();
  p.x=event.clientX;p.y=event.clientY;
  const local=p.matrixTransform(matrix.inverse());
  return toneClamp((110-local.y)/60,-1,1);
 }
 point.addEventListener('pointerdown',event=>{
  if(mode!=='manual')return;
  event.preventDefault();event.stopPropagation();
  dragging=true;
  point.setPointerCapture(event.pointerId);
  host.querySelector('.pp-program')?.classList.add('pp-tone-adjusting');
  updatePremiereToneCurve(pointerLevel(event));
 });
 point.addEventListener('pointermove',event=>{if(dragging)updatePremiereToneCurve(pointerLevel(event))});
 const endDrag=()=>{
  dragging=false;
  host.querySelector('.pp-program')?.classList.remove('pp-tone-adjusting');
 };
 point.addEventListener('pointerup',endDrag);
 point.addEventListener('pointercancel',endDrag);
 point.addEventListener('keydown',event=>{
  if(mode!=='manual'||!['ArrowUp','ArrowDown','Home'].includes(event.key))return;
  event.preventDefault();
  const next=event.key==='Home'?0:premiereToneLevels[premiereToneChannel]+(event.key==='ArrowUp'?.1:-.1);
  updatePremiereToneCurve(next);
 });
 selectPremiereToneChannel('RGB');
}

// Switch to about:blank by removing src on hidden scenes, so background audio

  }
}

function pointerStart(e,el,type){e.preventDefault();e.stopPropagation();raise(el);let id=el.dataset.id,startX=e.clientX,startY=e.clientY;const sc=Math.min(innerWidth/BASE_W,innerHeight/BASE_H),entry=layoutEntry(id);if(!entry)return;let initial=entry.slice(1);el.classList.remove('animating');let target=e.currentTarget;target.setPointerCapture(e.pointerId);const move=p=>{const dx=(p.clientX-startX)/sc,dy=(p.clientY-startY)/sc;let [x,y,w,h]=initial;if(type==='move'){x=clamp(x+dx,0,BASE_W-w);y=clamp(y+dy,51,BOTTOM-h);if(x<15)x=0;if(Math.abs(BASE_W-(x+w))<15)x=BASE_W-w;}else{w=clamp(w+dx,165,BASE_W-x);h=clamp(h+dy,105,BOTTOM-y)};entry.splice(1,4,x,y,w,h);applyGeometry(el,[x,y,w,h])};const end=()=>{target.removeEventListener('pointermove',move);target.removeEventListener('pointerup',end);target.removeEventListener('pointercancel',end)};target.addEventListener('pointermove',move);target.addEventListener('pointerup',end);target.addEventListener('pointercancel',end)}

/* Scene 02 demo: resize two different vertical dividers to demonstrate
   real ultrawide workspace adaptation, not merely move the pointer. */
async function demoDragPremiereEffects(id){
 const host=windowNodes.premiere;
 const fx=host?.querySelector('.pp-fx-layout');
 const divider=fx?.querySelector('.pp-fx-splitter');
 const properties=fx?.querySelector('.pp-fx-properties');
 if(!fx||!divider||!properties)return false;
 if(!await action(id,'上半部左右分隔','將 Effect Controls 與 Keyframes 間的垂直分隔線往右拖，擴大參數面板。'))return false;
 const scale=$('#desktop').getBoundingClientRect().width/BASE_W;
 const initial=properties.getBoundingClientRect().width/scale;
 const target=Math.min(fx.clientWidth-140,Math.max(initial+95,fx.clientWidth*.55));
 if(target<=initial+10)return true;
 const {x,y}=demoElementCoords(divider);
 cursorAt(x,y,600);
 if(!await delay(750,id))return false;
 $('#guideCursor').classList.add('dragging');
 fx.classList.add('pp-demo-resizing');
 try{
  cursorAt(x+target-initial,y,1450);
  properties.style.flexBasis=target+'px';
  if(!await delay(1520,id))return false;
  return await delay(420,id);
 }finally{
  $('#guideCursor').classList.remove('dragging');
  fx.classList.remove('pp-demo-resizing');
 }
}
async function demoDragPremiereTimeline(id){
 const host=windowNodes.premiere;
 const lower=host?.querySelector('.pp-bottom-left');
 const divider=lower?.querySelector('.pp-bottom-splitter');
 const project=lower?.querySelector('.pp-project');
 if(!lower||!divider||!project)return false;
 if(!await action(id,'下半部左右分隔','將 Effects 與 Timeline 間的垂直分隔線往左拖，擴大時間軸。'))return false;
 if(getComputedStyle(divider).display==='none')return true;
 const scale=$('#desktop').getBoundingClientRect().width/BASE_W;
 const initial=project.getBoundingClientRect().width/scale;
 const target=Math.max(125,Math.min(initial-65,lower.clientWidth*.19));
 if(target>=initial-10)return true;
 // Freeze the audio meter at its original narrow width. A 5fr track next to
 // the timeline's 1fr track made the meter take 5/6 of all spare space.
 const meter=lower.querySelector('.pp-meter');
 const actualMeterWidth=meter?.getBoundingClientRect().width/scale||lower.clientWidth*.05;
 const meterWidth=Math.max(19,Math.min(64,Math.round(actualMeterWidth)));
 const columns=w=>w+'px 5px minmax(0,1fr) '+meterWidth+'px';
 // Convert the starting grid track to px, allowing an actual animated resize.
 lower.style.gridTemplateColumns=columns(initial);
 void lower.offsetWidth;
 const {x,y}=demoElementCoords(divider);
 cursorAt(x,y,600);
 if(!await delay(750,id))return false;
 $('#guideCursor').classList.add('dragging');
 lower.classList.add('pp-demo-resizing');
 try{
  void lower.offsetWidth;
  cursorAt(x+target-initial,y,1450);
  lower.style.gridTemplateColumns=columns(target);
  if(!await delay(1520,id))return false;
  return await delay(420,id);
 }finally{
  $('#guideCursor').classList.remove('dragging');
  lower.classList.remove('pp-demo-resizing');
 }
}

/* Guided DOM interactions: cursor is visual, but each click/scroll updates the real mock UI. */
function demoElementCoords(el){
 const rect=el.getBoundingClientRect(),root=$('#desktop').getBoundingClientRect();
 const scale=root.width/BASE_W;
 return {x:clamp((rect.left+rect.width*.52-root.left)/scale,0,BASE_W),
         y:clamp((rect.top+rect.height*.52-root.top)/scale,0,BASE_H)};
}
async function demoTap(el,id,wait=650){
 if(!el)return false;
 const {x,y}=demoElementCoords(el);
 cursorAt(x,y,480);
 if(!await delay(620,id))return false;
 clickCursor();
 el.click();
 return await delay(wait,id);
}
async function demoScroll(el,amount,id){
 if(!el)return false;
 const limit=Math.max(0,el.scrollHeight-el.clientHeight);
 const target=clamp(el.scrollTop+amount,0,limit);
 // If this list cannot scroll, skip the empty cursor movement.
 if(Math.abs(target-el.scrollTop)<2)return true;
 const p=demoElementCoords(el);
 cursorAt(p.x+Math.min(el.clientWidth*.28,95),p.y,520);
 if(!await delay(530,id))return false;
 el.scrollTo({top:target,behavior:'smooth'});
 return await delay(930,id);
}
